{% extends "base.html" %}

{% block title %}Add Item to {{ agenda_name }}{% endblock %}

{% block content %}
<h2 class="text-center mb-4">➕ Add Item to {{ agenda_name }}</h2>
<form method="post">
    {% for key in keys %}
    <div class="mb-3">
        <label for="{{ key }}" class="form-label">{{ key }}:</label>
        <input type="text" name="{{ key }}" class="form-control" required>
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-custom">Add Item</button>
</form>
<div class="mt-3">
    <a href="/" class="btn btn-outline-secondary">⬅️ Back to Home</a>
</div>
{% endblock %}
