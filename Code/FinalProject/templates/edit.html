{% extends "base.html" %}

{% block title %}Edit Item{% endblock %}

{% block content %}
<h2 class="text-center mb-4">✏️ Edit Item</h2>
<div class="agenda mb-4">
    <h3>Current Item in {{ agenda_name }}</h3>
    <p>{{ item_str }}</p>
</div>
<form method="post">
    {% for key in keys %}
    <div class="mb-3">
        <label for="{{ key }}" class="form-label">{{ key }}:</label>
        <input type="text" name="{{ key }}" class="form-control" value="{{ item.get(key, '') }}" required>
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-custom">Done</button>
</form>
<div class="mt-3">
    <a href="/" class="btn btn-outline-secondary">⬅️ Back to Home</a>
</div>
{% endblock %}
