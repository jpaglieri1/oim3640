<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume to Job Description Scorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border: 2px dashed #667eea;
            border-radius: 8px;
            cursor: pointer;
            background: #f8f9ff;
            transition: background-color 0.3s;
            font-size: 14px;
            color: #667eea;
            font-weight: 500;
        }

        .file-input-label:hover {
            background-color: #f0f2ff;
        }

        .file-input-label.active {
            background-color: #e9ecff;
            border-color: #764ba2;
            color: #764ba2;
        }

        .file-name {
            display: inline-block;
            margin-left: 8px;
            color: #333;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            padding: 12px;
            background-color: #fee;
            border-left: 4px solid #f33;
            color: #c33;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }

        .results-container {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .results-container.show {
            display: block;
        }

        .results-container pre {
            background: white;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.6;
            color: #333;
            border: 1px solid #ddd;
        }

        .info-box {
            background: #e9ecff;
            border-left: 4px solid #667eea;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #666;
        }

        .file-types-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #856404;
        }

        .file-types-box strong {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .file-types-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .file-type-badge {
            background: white;
            border: 1px solid #ffc107;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 Resume Scorer</h1>
        <p class="subtitle">AI-Powered Resume to Job Description Analysis</p>

        <div class="info-box">
            ✨ Upload your resume and job description to get an AI-powered match analysis
        </div>

        <div class="file-types-box">
            <strong>📎 Accepted File Types:</strong>
            <div class="file-types-list">
                <span class="file-type-badge">.PDF</span>
                <span class="file-type-badge">.DOCX</span>
                <span class="file-type-badge">.TXT</span>
            </div>
        </div>

        <form id="analyzeForm">
            <div class="error" id="errorMessage"></div>

            <div class="form-group">
                <label for="resume">Resume (Required)</label>
                <div class="file-input-wrapper">
                    <input type="file" id="resume" name="resume" accept=".pdf,.txt,.docx,application/pdf,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required>
                    <label for="resume" class="file-input-label">
                        <span>📎 Click or drag to upload resume</span>
                        <span class="file-name" id="resumeName"></span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="job_description">Job Description (Required)</label>
                <div class="file-input-wrapper">
                    <input type="file" id="job_description" name="job_description" accept=".pdf,.txt,.docx,application/pdf,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required>
                    <label for="job_description" class="file-input-label">
                        <span>📎 Click or drag to upload job description</span>
                        <span class="file-name" id="jobDescName"></span>
                    </label>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Analyze Resume Match</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing your resume... This may take a moment.</p>
        </div>

        <div class="results-container" id="resultsContainer">
            <h2 style="margin-bottom: 15px; color: #333;">📊 Analysis Results</h2>
            <pre id="results"></pre>
        </div>
    </div>

    <script>
        const form = document.getElementById('analyzeForm');
        const resumeInput = document.getElementById('resume');
        const jobDescInput = document.getElementById('job_description');
        const submitBtn = document.getElementById('submitBtn');
        const loadingDiv = document.getElementById('loading');
        const resultsDiv = document.getElementById('resultsContainer');
        const resultsText = document.getElementById('results');
        const errorDiv = document.getElementById('errorMessage');
        const resumeLabel = document.querySelector('label[for="resume"].file-input-label');
        const jobDescLabel = document.querySelector('label[for="job_description"].file-input-label');

        // File input listeners
        resumeInput.addEventListener('change', function(e) {
            const fileName = e.target.files[0]?.name || '';
            document.getElementById('resumeName').textContent = fileName ? `✓ ${fileName}` : '';
            if (fileName) resumeLabel.classList.add('active');
            else resumeLabel.classList.remove('active');
        });

        jobDescInput.addEventListener('change', function(e) {
            const fileName = e.target.files[0]?.name || '';
            document.getElementById('jobDescName').textContent = fileName ? `✓ ${fileName}` : '';
            if (fileName) jobDescLabel.classList.add('active');
            else jobDescLabel.classList.remove('active');
        });

        // Drag and drop
        setupDragAndDrop(resumeInput, resumeLabel);
        setupDragAndDrop(jobDescInput, jobDescLabel);

        function setupDragAndDrop(input, label) {
            label.addEventListener('dragover', (e) => {
                e.preventDefault();
                label.classList.add('active');
            });

            label.addEventListener('dragleave', () => {
                label.classList.remove('active');
            });

            label.addEventListener('drop', (e) => {
                e.preventDefault();
                label.classList.remove('active');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    input.files = files;
                    input.dispatchEvent(new Event('change', { bubbles: true }));
                }
            });
        }

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Validate
            if (!resumeInput.files[0] || !jobDescInput.files[0]) {
                showError('Please select both files');
                return;
            }

            // Prepare form data
            const formData = new FormData();
            formData.append('resume', resumeInput.files[0]);
            formData.append('job_description', jobDescInput.files[0]);

            // Show loading
            submitBtn.disabled = true;
            loadingDiv.style.display = 'block';
            resultsDiv.classList.remove('show');
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || 'An error occurred during analysis');
                } else {
                    resultsText.textContent = data.result;
                    resultsDiv.classList.add('show');
                }
            } catch (error) {
                showError('Failed to communicate with server: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                loadingDiv.style.display = 'none';
            }
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
